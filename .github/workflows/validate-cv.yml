name: Validate, render and publish resume

on:
  push:
    branches:
      - main
    paths:
      - 'resume-*.json'
  pull_request:
    branches:
      - main
    paths:
      - 'resume-*.json'
      - 'scripts/**'
      - 'themes/**'
      - '.github/workflows/validate-cv.yml'

jobs:
  validate-resume:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install validation dependencies
        run: bun add resumed

      - name: Validate resume schema
        id: validate
        run: |
          # Run validation using the TypeScript script with Bun runtime
          set +e
          VALIDATION_RESULT=$(bun scripts/for-github-actions/validate-schema.ts 2>&1)
          VALIDATION_EXIT_CODE=$?
          set -e

          if [ "$VALIDATION_EXIT_CODE" -eq 0 ]; then
            echo "validation_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "validation_status=failed" >> "$GITHUB_OUTPUT"
            {
              echo "validation_output<<EOF"
              echo "$VALIDATION_RESULT"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Post PR comment on validation failure
        if: steps.validate.outputs.validation_status == 'failed' && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATION_OUTPUT: ${{ steps.validate.outputs.validation_output }}
        run: |
          # Use the TypeScript post-pr-comment script with Bun runtime
          # Pass validation output via environment variable to avoid bash escaping issues
          bun scripts/for-github-actions/post-pr-comment.ts "$VALIDATION_OUTPUT" "${{ github.event.pull_request.number }}"

      - name: Post PR comment on validation success
        if: steps.validate.outputs.validation_status == 'success' && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use the TypeScript post-pr-comment script with Bun runtime
          # Pass "success" to indicate validation passed
          bun scripts/for-github-actions/post-pr-comment.ts "success" "${{ github.event.pull_request.number }}"

      - name: Fail workflow if validation failed
        if: steps.validate.outputs.validation_status == 'failed'
        run: exit 1

  publish-resume:
    needs: validate-resume
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Publish resume to gist (english only)
        env:
          GH_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
        run: |
          gh gist edit 8e587fe79ca40a637589b1d2d5c9373d resume-json/resume-en.json

  render-resume:
    needs: validate-resume
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install

      - name: Render resume with all relevant themes
        run: bun render

      - name: Detect changed files in rendered/
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: rendered/** # Only track changes in rendered/
          files_ignore: rendered/.gitkeep # Optional: Ignore .gitkeep if present

      - name: Commit rendered files
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          BRANCH_NAME="update-rendered-cv-${{ github.run_id }}"
          git config user.name "render-cv[bot]"
          git config user.email "render-cv[bot]@users.noreply.github.com"
          git checkout -b $BRANCH_NAME
          git add rendered/*
          git commit -m "chore: update rendered CV files"
          git push origin $BRANCH_NAME

      - name: Create pull request
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ steps.create_branch.outputs.branch_name }}"
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "chore: update rendered CV files" \
            --body "This PR updates automatically re-rendered CV HTML files since the contents of the resume have changed."
